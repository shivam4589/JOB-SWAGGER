services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobqueue
      POSTGRES_USER: jobqueue
      POSTGRES_PASSWORD: jobqueue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobqueue -d jobqueue"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobqueue
      DB_USER: jobqueue
      DB_PASSWORD: jobqueue
    ports:
      - "8081:8080"

  # Same image, worker mode. Scale it: docker compose up -d --scale worker=3
  # Workers also run the web server (internal only) so Prometheus can scrape /actuator/prometheus on each.
  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobqueue
      DB_USER: jobqueue
      DB_PASSWORD: jobqueue
      JOBQUEUE_WORKER_ENABLED: "true"
      JOBQUEUE_WORKER_CONCURRENCY: "4"
      # Short timeout so the crash-recovery demo is quick. In real use it must exceed your slowest job.
      JOBQUEUE_WORKER_LOCK_TIMEOUT_SECONDS: "30"
      JOBQUEUE_WORKER_REAPER_INTERVAL_MS: "5000"
      # 4 worker threads + reaper + scheduler need few connections; keeps 6+ containers under Postgres' 100-connection limit
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "6"

  # Monitoring: Prometheus scrapes the API and every worker; Grafana shows the dashboard.
  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:
